[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the production Netlify hostname on the canonical custom domain.
[[redirects]]
  from = "https://chic-elf-916778.netlify.app/*"
  to = "https://rachelboyerlmft.com/:splat"
  status = 301
  force = true
